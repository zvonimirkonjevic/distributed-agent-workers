services:
  api:
    container_name: distributed-agent-workers-api
    build:
      context: .
      dockerfile: services/api/environment/Dockerfile.local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      INSIDE_CONTAINER: "true"
    depends_on:
      - postgres

  postgres:
    container_name: distributed-agent-workers-postgres
    image: public.ecr.aws/docker/library/postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  localstack:
    container_name: distributed-agent-workers-localstack
    # 4.14.0 is the last community release; 2026.03.0+ refuses to start without LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs

volumes:
  postgres_data:
