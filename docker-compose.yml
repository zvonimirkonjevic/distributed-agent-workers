services:
  api:
    container_name: distributed-agent-workers-api
    build:
      context: .
      dockerfile: services/api/environment/Dockerfile.local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      INSIDE_CONTAINER: "true"
    depends_on:
      - postgres

  postgres:
    container_name: distributed-agent-workers-postgres
    image: public.ecr.aws/docker/library/postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
